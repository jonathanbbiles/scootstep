# codemagic.yaml — ScootSteps · iOS → TestFlight (Capacitor 8 / SPM → archive the .xcodeproj)
# Reconciled against the App Builder Template's PROVEN green file (ChordLoop lineage).
# =============================================================================
# FOR THE SIGNING SESSION (the only things to fill / confirm — code is done):
#   1. ChordLoopAPIKey  → the reusable App Store Connect API key already stored in
#      Codemagic (PLAYBOOK §0.3), e.g. "ChordLoopAPIKey".
#   2. "6792406139" → App Store Connect → App Information, after the app record
#      is created for bundle id  com.jonathanbiles.scootstep  (PLAYBOOK §5.2).
#   3. Code signing identities must hold BOTH (PLAYBOOK §0.4):
#        • cert    "JB_Shared_Distribution"  (the one shared Apple Distribution cert)
#        • profile app_store profile for  com.jonathanbiles.scootstep  bound to it
#      (create the App ID + that profile once — §0.4 step 2 — and Fetch/Upload it).
#   Nothing else. No third-party API key (ScootSteps is fully offline). iPhone-only,
#   portrait — so NO iPad 13" screenshots are required for the listing.
# =============================================================================

workflows:
  ios-testflight:
    name: ScootSteps iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # --- Auto-build on push to main -----------------------------------------
    # A push to main starts this workflow automatically: no browser, no "Start
    # build" click. See PLAYBOOK.md "Shipping without the browser".
    # ONE-TIME per app in the Codemagic UI: the repo needs a webhook registered
    # (app -> Settings -> Webhooks -> "Add webhook"). Apps configured via
    # codemagic.yaml, or connected over SSH/HTTPS rather than the GitHub App, do
    # NOT get one automatically -- without it this block is inert and nothing
    # breaks, builds just never self-start.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # A newer push supersedes an in-flight build of the same branch.
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.jonathanbiles.scootstep"
      vars:
        BUNDLE_ID: "com.jonathanbiles.scootstep"
        XCODE_PROJECT: "ios/App/App.xcodeproj"     # SPM path (Capacitor 8) — ChordLoop-proven default
        XCODE_SCHEME: "App"
        ASC_APP_ID: "6792406139"             # fill after the ASC app record exists (§5.2)
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Bake Apple preview URLs into the bundle
        script: |
          set -e
          # Resolve every catalog song's real 30-second preview URL and exact Apple Music track
          # page HERE, in Node, where searching works — the runtime iTunes Search lookup does not
          # get through from the webview on device. The app then plays a baked https URL straight
          # from an <audio> element and never searches at all.
          #
          # Deliberately NOT --check: a flaky Apple response must not fail the build, because the
          # script keeps the previously committed URLs for anything it cannot resolve. It prints
          # exactly what it resolved, kept, or missed.
          node scripts/bake-previews.mjs
          echo "--- baked entries ---"
          grep -c '"preview"' www/js/data.previews.js

      - name: Add + sync iOS platform (Capacitor)
        script: |
          set -e
          [ -d ios ] || npx cap add ios

          # ---- ITMS-90068: force iOS 15 BETWEEN `cap add` and `cap sync` --------------------
          # Capacitor 8's template happens to emit 15.0 today, but nothing in this build ever
          # asserted it — a template bump (or a plugin dragging the target down) would sail
          # through and come back as an ITMS-90068 rejection AFTER upload, which costs a whole
          # submit cycle. Pin it here, where `cap sync` will still propagate it to the SPM
          # package and the plugin targets, and fail the build if the pin does not take.
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"
          # NB: written as a full if-block, NOT `[ -f x ] && sed ...`. Under `set -e` that
          # one-liner exits the whole step with status 1 whenever the file is absent — the test
          # failing IS the step failing. A missing SPM package must skip this, not kill the build.
          SPM=ios/App/CapApp-SPM/Package.swift
          if [ -f "$SPM" ]; then
            sed -i '' 's/\.iOS(\.v[0-9]*)/.iOS(.v15)/g' "$SPM"
          fi
          echo "--- deployment targets after pin ---"
          grep -o "IPHONEOS_DEPLOYMENT_TARGET = [^;]*;" "$PBX" | sort -u
          if [ -f "$SPM" ]; then grep -o "platforms: \[[^]]*\]" "$SPM" || true; fi
          # Verify: every occurrence must be 15.0, and none may be lower.
          if grep -o "IPHONEOS_DEPLOYMENT_TARGET = [^;]*;" "$PBX" | grep -qv "= 15.0;"; then
            echo "ITMS-90068 GUARD FAILED: a deployment target other than 15.0 survived in $PBX" >&2
            grep -n "IPHONEOS_DEPLOYMENT_TARGET" "$PBX" >&2
            exit 1
          fi
          echo "==> deployment target pinned to iOS 15.0 (ITMS-90068 guard passed)"

          npx cap sync ios          # copies www/ -> ios/App/App/public/ (the SHIPPED bundle)

      - name: ScootSteps native patches — iPhone-only + portrait lock
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          # Portrait-only (brief: portrait-primary, iPhone-only build 1)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          # iPhone-only device family (sidesteps the iPad-13in screenshot blocker that rejected Slow Burn)
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$PLIST"
          # canonical device-family switch in the Xcode target too
          find ios -name project.pbxproj -exec sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' {} +
          echo "Patched Info.plist:"; /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST" || true

      - name: ScootSteps native patch — media-volume audio session (.playback)
        script: |
          set -e
          # Without this the app inherits iOS's default .soloAmbient category, which follows the
          # hardware ringer switch — the count track and song previews both go silent the moment
          # the phone is flipped to silent. This is the fix for "sound only plays with silent mode
          # OFF". The script verifies its own work and exits non-zero if the patch did not land,
          # so a silent no-op fails the build here instead of shipping a mute app.
          bash scripts/patch-ios-audio.sh .
          echo "----- AppDelegate.swift audio session block -----"
          sed -n '/ScootSteps: media-volume/,/end ScootSteps audio session/p' ios/App/App/AppDelegate.swift

      - name: ScootSteps native patch — app-target privacy manifest
        script: |
          # Capacitor's frameworks carry their own PrivacyInfo.xcprivacy; the APP target had none.
          # This writes one declaring no tracking, no collected data types and no required-reason
          # APIs — the machine-readable twin of the "Data Not Collected" answer in App Store
          # Connect. The script adds it to the Resources build phase (a manifest that exists on
          # disk but is not a target resource never reaches the .app) and self-verifies.
          #
          # NON-FATAL on purpose (matches Moodie). Apple requires a privacy manifest from
          # third-party SDKs and for required-reason API use; the App target itself calls no
          # required-reason API — the ones Capacitor uses ship inside Capacitor's own frameworks,
          # which carry their own manifests. So this file is a belt-and-braces accurate
          # declaration, not a submission blocker, and it must never be the reason an otherwise
          # shippable build dies. The script mutates project.pbxproj via a Ruby/Python round-trip;
          # if a toolchain bump ever breaks that, the correct outcome is a loud warning and a
          # shipped build, not a red build over a file Apple is not going to ask this target for.
          if bash scripts/patch-ios-privacy-manifest.sh .; then
            echo "----- PrivacyInfo.xcprivacy -----"
            cat ios/App/App/PrivacyInfo.xcprivacy
          else
            echo "WARNING: privacy-manifest patch failed (rc=$?) — continuing without it." >&2
            echo "WARNING: this is NOT a submission blocker for this target; see the note above." >&2
          fi

      - name: Embed the app icon (replace Capacitor default)
        script: |
          # appicon-1024.png lives at the repo root (ASSETS-SPEC.md). Re-embedding on every build
          # means the Capacitor placeholder (an automatic App Store rejection) can never survive.
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          cp appicon-1024.png "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          { "images": [ { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          JSON
          echo "Embedded app icon:"; ls -la "$ICONSET"

      - name: Set marketing version + build number + export-compliance flag
        script: |
          set -e
          PLIST=ios/App/App/Info.plist

          # Marketing version is pinned to the string App Store Connect actually holds — "1.0",
          # not "1.0.0". A build stamped 1.0.0 uploads and processes fine and then simply never
          # appears in the build picker for ASC version 1.0, because it cannot attach to a
          # version string it does not match. (Moodie lost a cycle to exactly this.)
          MARKETING_VERSION="1.0"

          # ---- WHY THIS IS A UTC TIMESTAMP AND NOT "latest + 1" -----------------------------
          # This step used to read:
          #     LATEST=$(app-store-connect get-latest-testflight-build-number "$ASC_APP_ID" \
          #                2>/dev/null || echo 0)
          #     NEXT=$(( LATEST + 1 ))
          # That is the bug that kept every ScootSteps build out of TestFlight while Codemagic
          # reported a green build, and it is a closed loop, not a flake:
          #   * get-latest-testflight-build-number reports the highest build VISIBLE IN
          #     TESTFLIGHT. App Store Connect, however, requires an uploaded build to exceed the
          #     highest number EVER used for that version — including builds that failed
          #     processing and are therefore invisible to that query. With stderr swallowed by
          #     2>/dev/null, any failure of the call also silently collapses to LATEST=0.
          #   * So the build stamps 1, uploads, and ASC rejects it ASYNCHRONOUSLY — after the
          #     upload completes — with ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE. Nothing lands
          #     in TestFlight. The next build asks "what is the latest?", is told 0 again,
          #     stamps 1 again, and collides again. Forever.
          #   * The upload itself genuinely succeeds every time, which is why the Publishing
          #     step burns a real ~70 seconds and still goes green: the rejection happens on
          #     Apple's side after Codemagic has handed the binary over and stopped watching.
          #     A green Codemagic build is NOT evidence that a build reached TestFlight.
          # A UTC timestamp is monotonic by construction, needs no network round-trip to work
          # out "the last one plus one", and can never collide with a number this app has
          # already burned. Slow Burn hit the same DUPLICATE error; Moodie ships on this fix.
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          # No custom crypto -> skip the per-build export-compliance prompt.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

          # Read the values back OUT of the plist rather than echoing the shell variables — the
          # point is to prove what the archive will actually carry, not what we intended. An
          # unexpanded $(CURRENT_PROJECT_VERSION) here means PlistBuddy silently no-opped.
          STAMPED_V="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")"
          STAMPED_B="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"
          echo "CFBundleShortVersionString = $STAMPED_V"
          echo "CFBundleVersion            = $STAMPED_B"
          case "$STAMPED_B" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "BUILD NUMBER GUARD FAILED: '$STAMPED_B' is not a 12-digit UTC timestamp." >&2
               echo "Shipping a non-monotonic build number is what caused the TestFlight" >&2
               echo "DUPLICATE deadlock. Failing here instead of uploading a doomed binary." >&2
               exit 1 ;;
          esac
          [ "$STAMPED_V" = "$MARKETING_VERSION" ] || {
            echo "VERSION GUARD FAILED: plist holds '$STAMPED_V', expected '$MARKETING_VERSION'." >&2
            exit 1
          }
          echo "==> stamped $STAMPED_V ($STAMPED_B)"

      - name: Set up code signing — apply the stored profile + the ONE shared cert (no mint, no revoke)
        script: |
          security find-identity -v -p codesigning || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles

      - name: Build signed IPA (SPM → --project)
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # "Post-processing failed" is usually just the external-beta step — the binary still
        # uploads to TestFlight fine. Check TestFlight before calling it a failure (GOTCHAS.md).
        # Review submit is the opt-in post-publish step below (PLAYBOOK §8).

        # submit_to_app_store is deliberately NOT used here. It would submit on
        # EVERY green build, and it cannot supply screenshots or release notes.
        # The review submit is the opt-in post-publish step below instead.

      # --- Post-publish: submit for App Store review (opt-in, per build) --------
      # Runs AFTER the block above has uploaded the signed IPA, so a build exists
      # for the submission to attach to.
      #
      # This does nothing unless SUBMIT_FOR_REVIEW=true, and that variable is
      # deliberately NOT defined anywhere in this repo. It can only arrive as a
      # per-build override from the Codemagic REST API:
      #     scripts/cm-build.sh --submit --watch
      # So an ordinary build — and any push — stops at TestFlight by construction,
      # rather than by remembering to keep a toggle switched off.
      scripts:
        - name: Submit for App Store review (only when explicitly requested)
          script: bash scripts/asc-submit.sh

  # ---------------------------------------------------------------------------
  # On-demand, READ-ONLY check that the App Store Connect key stored in Codemagic
  # can actually drive a submission. Submits nothing, signs nothing, builds nothing.
  # Deliberately has no `triggering:` block, so a push can never run it.
  #     scripts/cm-build.sh -w asc-auth-check --watch
  # ---------------------------------------------------------------------------
  asc-auth-check:
    name: ScootSteps — ASC auth check (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        ASC_APP_ID: "6792406139"
      xcode: latest
    scripts:
      - name: Prove the ASC key authenticates for a submission (submits nothing)
        script: bash scripts/asc-auth-check.sh

  # ===========================================================================
  # ScootSteps Android → signed release AAB (Capacitor 8 → Gradle → bundleRelease)
  # ===========================================================================
  # The pilot for the whole Android half of the factory. Everything here is meant
  # to be copied to the other apps by changing PACKAGE_NAME, VERSION_NAME, the
  # cert fingerprint, and the app's own native-patch step.
  #
  # ONE-TIME PER APP (already done for ScootSteps):
  #   1. An upload keystore exists at ~/.config/android-keystores/<app>-upload.p12
  #      on Jonathan's Mac. THIS FILE IS IRREPLACEABLE once Play has seen it —
  #      losing it means opening a Google support case to reset the upload key.
  #   2. Its base64 + passwords are stored as SECURE variables in the Codemagic
  #      variable group `google_play` on this app. They are never in this repo.
  #
  # NOT wired to Google Play yet: the developer account is still in Google's
  # identity-verification queue. The `publishing.google_play` block at the bottom
  # is the last step and stays commented until the account is live.
  android-release:
    name: ScootSteps Android — signed AAB
    instance_type: linux_x2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: android-pilot
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
        # ANDROID_KEY_PASSWORD — all secure, set via the Codemagic API, never printed.
        - google_play
      vars:
        PACKAGE_NAME: "com.jonathanbiles.scootstep"   # == the iOS bundle id, on purpose
        VERSION_NAME: "1.0"                            # == iOS CFBundleShortVersionString
        # Public fingerprint of the upload certificate. Not a secret — it is the
        # thing Google publishes back to you. Pinned so a build signed by the WRONG
        # key fails here instead of at the Play upload screen weeks later.
        ANDROID_UPLOAD_CERT_SHA256: "7D:CC:13:2F:02:3E:85:41:1D:CD:03:47:1C:B9:27:1D:EE:70:4F:4F:C4:1F:8E:E8:C7:87:D9:1F:9D:82:04:66"
        ANDROID_COMPILE_SDK: "36"
      node: 22
      java: 21

    scripts:
      # ---- fail fast on the secret, before spending 6 minutes on Gradle ---------
      - name: Materialise + verify the upload keystore
        script: |
          set -eu
          # No `set -x` anywhere in this step. Codemagic masks secure values in the
          # log, but the password also reaches keytool via a file, never argv, so it
          # cannot leak through `ps` on a shared runner either.
          : "${ANDROID_KEYSTORE_B64:?the google_play variable group is not attached to this workflow}"
          : "${ANDROID_KEYSTORE_PASSWORD:?}"
          : "${ANDROID_KEY_ALIAS:?}"

          KS="$HOME/upload-keystore.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          [ -s "$KS" ] || { echo "keystore decoded to an empty file" >&2; exit 1; }

          # The keystore is a PKCS12 built with openssl (this laptop has no JDK, so
          # keytool was not available to create one). PKCS12 is Java's own default
          # format since JDK 9, but openssl will happily default to the legacy
          # RC2-40 PBE that JDK 17+ refuses to read — and Gradle reports that as an
          # opaque "keystore password was incorrect". Proving keytool can open it
          # HERE turns that into a one-line, obvious failure.
          if ! keytool -list -keystore "$KS" -storetype PKCS12 \
                 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /tmp/ks.txt 2>&1; then
            echo "KEYSTORE GUARD FAILED — keytool could not read the upload keystore." >&2
            sed 's/[A-Za-z0-9+/]\{24,\}/[redacted]/g' /tmp/ks.txt >&2
            exit 1
          fi
          grep -o 'SHA256: .*' /tmp/ks.txt || true
          echo "==> upload keystore opens cleanly under keytool"

      - name: Install npm dependencies
        script: npm install

      - name: Bake Apple preview URLs into the bundle
        script: |
          set -e
          # Same step as the iOS workflow, so both platforms ship byte-identical
          # web assets. Deliberately not --check: a flaky Apple response keeps the
          # previously committed URLs rather than failing the build.
          node scripts/bake-previews.mjs
          echo "--- baked entries ---"
          grep -c '"preview"' www/js/data.previews.js

      - name: Install the Android SDK packages this project compiles against
        script: |
          set -e
          # AGP 8 removed automatic SDK downloading, so a compileSdk the image does
          # not happen to ship fails deep inside Gradle configuration with a message
          # that reads like a plugin error. Ask for it explicitly instead.
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "==> android-$ANDROID_COMPILE_SDK present"

      - name: Add + sync Android platform (Capacitor)
        script: |
          set -e
          # android/ is gitignored and regenerated here, exactly like ios/. Every
          # persistent native fact therefore lives in scripts/, not in the tree.
          [ -d android ] || npx cap add android
          npx cap sync android    # copies www/ -> android/app/src/main/assets/public
          echo "--- capacitor plugins wired into the Android build ---"
          cat android/capacitor.settings.gradle

      - name: ScootSteps native patches — icon, splash, portrait lock, heap
        script: bash scripts/patch-android.sh .

      - name: Inject release signing config + stamp version
        script: |
          set -eu
          # keystore.properties is written here, AFTER cap add android has created the
          # directory it lives in. It holds the password in plaintext on the build
          # machine only; the file is never committed (android/ is gitignored) and the
          # instance is destroyed with the build.
          umask 077
          cat > android/keystore.properties <<EOF
          storeFile=$HOME/upload-keystore.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=PKCS12
          EOF
          python3 scripts/patch-android-gradle.py --version-name "$VERSION_NAME"

      - name: Build the signed release AAB
        script: |
          set -e
          cd android
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Prove the AAB is real, signed, and signed by OUR upload key
        script: |
          set -e
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)"
          [ -n "$AAB" ] || { echo "no AAB produced" >&2; exit 1; }
          echo "==> $AAB ($(du -h "$AAB" | cut -f1))"

          # 1. It is a signed jar at all. An unsigned bundle builds green and is only
          #    rejected at the Play upload screen — the Android twin of the iOS
          #    "green build that never reached TestFlight" trap this factory already
          #    paid for once.
          jarsigner -verify "$AAB" | tee /tmp/jarverify.txt
          grep -q "jar verified" /tmp/jarverify.txt || {
            echo "SIGNING GUARD FAILED: the AAB is not signed." >&2; exit 1; }

          # 2. It is signed by the expected certificate, not some other key that also
          #    happens to be valid.
          SIGFILE="$(unzip -Z1 "$AAB" 'META-INF/*.RSA' | head -1)"
          unzip -p "$AAB" "$SIGFILE" > /tmp/sig.rsa
          ACTUAL="$(keytool -printcert -file /tmp/sig.rsa | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')"
          echo "expected: $ANDROID_UPLOAD_CERT_SHA256"
          echo "actual:   $ACTUAL"
          [ "$ACTUAL" = "$ANDROID_UPLOAD_CERT_SHA256" ] || {
            echo "SIGNING GUARD FAILED: AAB signed by an unexpected certificate." >&2; exit 1; }

          # 3. The manifest inside the bundle really carries the identifiers Play
          #    will key the listing on, and a versionCode Play will actually accept.
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$AAB" 2>/dev/null | head -5 || \
            unzip -p "$AAB" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties || true
          VC="$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')"
          echo "versionCode=$VC versionName=$VERSION_NAME package=$PACKAGE_NAME"
          [ "$VC" -lt 2100000000 ] || {
            echo "VERSION GUARD FAILED: versionCode $VC exceeds Play's 2,100,000,000 cap." >&2; exit 1; }
          echo "==> AAB verified: signed by the upload key, versionCode within Play's range"

    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/mapping/**/mapping.txt

    # publishing.google_play is intentionally absent: the Play developer account is
    # still in Google's identity-verification queue, and a publishing block pointing
    # at a track that does not exist fails the build after a successful compile.
    # When the account is live, add:
    #
    #   publishing:
    #     google_play:
    #       credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # secure, group google_play
    #       track: internal
    #       submit_as_draft: true
